# 谛听 —— 人手锚点自动演奏（最小版）配置
#
# 演奏区几何**不在这里**：它在 geometry/notes_geometry.json（从游戏数据导出的），
# 由 src/bandori_autoplay/geometry.py 按屏幕尺寸算——不需要任何标定。

device:
  serial: null            # null = 自动选第一个在线设备
  # null = 用随包的 platform-tools\adb.exe（推荐，换电脑也能用）；
  # 想指定自己的 adb，就把路径写在这里（写错了会自动退回随包的那份）
  adb_path: null

touch:
  # uhid：借 scrcpy-server 注册一块虚拟触摸屏（系统认成真外设，非 root 可用）
  backend: uhid
  scrcpy_jar: tools/scrcpy/scrcpy-server-v4.1

play:
  # 整体微调（毫秒，正 = 提前）。打完看结算页：FAST 多就调大，SLOW 多就调小。
  offset_ms: 0.0
  # 量不到往返延迟时的兜底值（实测量级 20~50 毫秒）
  default_latency_ms: 35.0
  # 接管提前量：比这更近的音符来不及发，直接跳过
  handover_lead_s: 0.015
  # 认 LIVE START 的最低匹配度
  template_score: 0.62
  # 等确认页最多等多久（秒）
  confirm_timeout_s: 120.0

paths:
  chartdb: work/chartdb/out      # 谱面（our-notes-chartdb）
  master: work/master            # 曲名表（MasterText / MasterLiveMusic）
  logs: logs
  live_start_template: tools/live_start_template.png
